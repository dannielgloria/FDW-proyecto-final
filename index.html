<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleccionar perfil | Disney+ </title>
    <link rel="icon" href="./img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="profiles-page">

    <header class="profiles-header">
        <div class="dplus-mark">
            <span class="dplus">Disney+</span>
        </div>
    </header>
    <main class="profiles-main">
        <h1 class="profiles-title">¿Quién anda ahí?</h1>
        <section class="profiles-grid">
            <button class="profiles-card" type="button">
                <img src="./img/profiles/profile1.png" alt="Perfil 1">
                <span>Perfil 1</span>
            </button>

            <button class="profiles-card" type="button">
                <img src="./img/profiles/profile2.png" alt="Perfil 2">
                <span>Perfil 2</span>
            </button>

            <button class="profiles-card add-profile" type="button">
                <div class="add-circle">+</div>
                <span>Crear Perfil</span>
            </button>

        </section>
        <p class="profiles-hint">Demo educativa (sin login real).</p>
    </main>
    
</body>
</html>
