<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleccionar perfil | Disney+ </title>
    <link rel="icon" href="./img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="profiles-page">

    <header class="profiles-header">
        <div class="logo" role="img">
        </div>
    </header>
    <main class="profiles-main">
        <h1 class="profiles-title">¿Quién anda ahí?</h1>
        <section class="profiles-grid">
            <button class="profiles-card" type="button" onclick="window.location.href='./home.html'">
                <img src="./img/profiles/profile1.png" alt="Perfil 1">
                <span>Perfil 1</span>
            </button>

            <button class="profiles-card" type="button">
                <img src="./img/profiles/profile2.png" alt="Perfil 2">
                <span>Perfil 2</span>
            </button>

            <button class="profiles-card add-profile" type="button" disabled>
                <div class="add-circle">
                    <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0,0,256,256" width="74px" height="74px" fill-rule="evenodd">
                        <g fill="#ffffff" fill-rule="evenodd"
                            stroke="none" stroke-width="1" stroke-linecap="butt" 
                            stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" 
                            stroke-dashoffset="0" font-family="none" font-weight="none" 
                            font-size="none" text-anchor="none" style="mix-blend-mode: normal">
                            <g transform="scale(10.66667,10.66667)">
                            <path d="M11,2v9h-9v2h9v9h2v-9h9v-2h-9v-9z">
                            </path>
                            </g>
                        </g>
                    </svg>
                </div>
                <span>Crear Perfil</span>
            </button>

        </section>
        <p class="profiles-hint">Demo educativa (sin login real).</p>
    </main>
    
</body>
</html>
